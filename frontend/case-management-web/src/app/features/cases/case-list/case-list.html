<h1>Cases</h1>

<app-case-filters [values]="filters()" (valuesChange)="changeFilters($event)" />

<app-case-summary [summary]="summary()" />

<mat-progress-bar [mode]="showProgress() ? 'indeterminate' : 'determinate'" [value]="0" />

@if (errorMessage(); as message) {
  <app-state-message icon="cloud_off" [message]="message" actionLabel="Retry" (action)="retry()" />
} @else if (isEmpty()) {
  <app-state-message
    icon="search_off"
    message="No cases match your filters"
    actionLabel="Clear filters"
    (action)="clearFilters()"
  />
} @else {
  <div class="table-container">
    <table
      mat-table
      [dataSource]="rows()"
      matSort
      matSortDisableClear
      [matSortActive]="sort().active"
      [matSortDirection]="sort().direction"
      (matSortChange)="changeSort($event)"
    >
      <ng-container matColumnDef="Title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let case">{{ case.title }}</td>
      </ng-container>

      <ng-container matColumnDef="OrganizationName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Organization</th>
        <td mat-cell *matCellDef="let case">{{ case.organizationName }}</td>
      </ng-container>

      <ng-container matColumnDef="Status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let case">
          <app-case-status-editor [case]="case" (applied)="applyRow($event)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="Priority">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
        <td mat-cell *matCellDef="let case">
          <span class="tag" [attr.data-priority]="case.priority">{{ case.priority }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="CreatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
        <td mat-cell *matCellDef="let case">{{ case.createdAt | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="UpdatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
        <td mat-cell *matCellDef="let case">{{ case.updatedAt | date: 'medium' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [length]="totalCount()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    (page)="changePage($event)"
  />
}
