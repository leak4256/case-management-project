name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [master, step-24-azure]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/case-management-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/case-management-web/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production,azure

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/case-management-web/dist/case-management-web/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
